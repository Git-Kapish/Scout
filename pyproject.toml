[project]
name = "scout"
version = "0.1.0"
description = "Durable, Budgeted, Traceable Multi-Agent Research Assistant on Free-Tier Models"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckduckgo-search>=6.1.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "langchain-core>=0.2.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-redis>=0.0.1",
    "openai>=1.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "rank-bm25>=0.2.2",
    "redis>=5.0.4",
    "rich>=13.7.0",
    "sse-starlette>=2.1.0",
    "tavily-python>=0.3.0",
    "trafilatura>=1.9.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.4.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
